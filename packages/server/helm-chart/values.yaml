# Server service values
replicaCount: 1
image:
  repository: mnemo/server
  tag: latest
  pullPolicy: IfNotPresent
service:
  type: ClusterIP
  port: 3100

# Ingress values
ingress:
  enabled: true
  ingressClassName: nginx
  annotations: []
    # nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    # nginx.ingress.kubernetes.io/rewrite-target: /
  host: mnemo-server.local

persistence:
  gifs:
    storageClassName: local-path # shared-manual will create a pv
    path: # Mandatory if shared-manual is used (and only used then)
    capacity: 10Gi
  uploads:
    storageClassName: local-path # shared-manual will create a pv
    path: # Mandatory if shared-manual is used (and only used then)
    capacity: 1Gi

# Gateway API HTTPRoute - successor to the Ingress (same routing, declared
# in the chart). ingress and route are independent during a migration window.
route:
  enabled: false
  # Gateway(s) to attach to, e.g.:
  #   - name: gateway-public
  #     namespace: gateway-public
  parentRefs: []
  hostnames: []
  annotations: {}
