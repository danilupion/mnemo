# Server service values
replicaCount: 1
image:
  repository: mnemo/server
  tag: latest
  pullPolicy: IfNotPresent
service:
  type: ClusterIP
  port: 3100

persistence:
  gifs:
    storageClassName: local-path # shared-manual will create a pv
    path: # Mandatory if shared-manual is used (and only used then)
    capacity: 10Gi
  uploads:
    storageClassName: local-path # shared-manual will create a pv
    path: # Mandatory if shared-manual is used (and only used then)
    capacity: 1Gi

# Gateway API HTTPRoute (the chart's only exposure mechanism since 1.0.0;
# the Ingress template was removed with the ingress-nginx retirement).
route:
  enabled: false
  # Gateway(s) to attach to, e.g.:
  #   - name: gateway-public
  #     namespace: gateway-public
  parentRefs: []
  hostnames: []
  annotations: {}
